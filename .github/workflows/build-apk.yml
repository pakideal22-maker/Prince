
name: Build Multi-Assistant Android v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android v2 project
        run: |
          mkdir -p android
          unzip -q Multi_Assistant_Android_v2_Drive_Robot_Source.zip -d android
          test -f android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: cd android && gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Display OAuth certificate fingerprint
        run: |
          cd android
          gradle :app:signingReport --no-daemon > SIGNING_CERT_REPORT.txt
          grep -A 9 'Variant: debug' SIGNING_CERT_REPORT.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Assistant-Android-v2-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/SIGNING_CERT_REPORT.txt
          retention-days: 14
