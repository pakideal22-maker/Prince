name: Build Multi-Assistant v5 Three Platforms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract portable Windows source
        shell: pwsh
        run: Expand-Archive -Path Multi_Assistant_v5_Windows_Chromebook_Source.zip -DestinationPath portable -Force
      - name: Run tests and build exe
        shell: pwsh
        working-directory: portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements_drive.txt pyinstaller
          python -m unittest discover -s tests -p 'test_*.py' -q
          pyinstaller --noconfirm --clean --onefile --windowed --name Multi-Assistant-Portable-Windows --collect-all keyring --collect-all googleapiclient --collect-all google_auth_oauthlib --hidden-import google.auth.transport.requests --hidden-import google.oauth2.credentials --hidden-import PySide6.QtTextToSpeech main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Assistant-Windows-Portable
          path: portable/dist/Multi-Assistant-Portable-Windows.exe
          if-no-files-found: error
  chromebook_linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Extract portable Linux source
        run: mkdir portable && unzip -q Multi_Assistant_v5_Windows_Chromebook_Source.zip -d portable
      - name: Run tests and build Linux executable
        working-directory: portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements_drive.txt pyinstaller
          python -m unittest discover -s tests -p 'test_*.py' -q
          pyinstaller --noconfirm --clean --onefile --windowed --name Multi-Assistant-Portable-Linux --collect-all keyring --collect-all googleapiclient --collect-all google_auth_oauthlib --hidden-import google.auth.transport.requests --hidden-import google.oauth2.credentials --hidden-import PySide6.QtTextToSpeech main.py
          chmod +x dist/Multi-Assistant-Portable-Linux
          tar -czf Multi-Assistant-Portable-Chromebook-Linux-x86_64.tar.gz -C dist Multi-Assistant-Portable-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Assistant-Chromebook-Linux-x86_64
          path: portable/Multi-Assistant-Portable-Chromebook-Linux-x86_64.tar.gz
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Android source
        run: mkdir android && unzip -q Multi_Assistant_v5_Android_Source.zip -d android
      - name: Compile Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Display signing certificate for OAuth setup
        working-directory: android
        run: gradle :app:signingReport --no-daemon > SIGNING_CERT_REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Assistant-Android-v5-APK-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/SIGNING_CERT_REPORT.txt
          if-no-files-found: error
